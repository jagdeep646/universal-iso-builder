[project]
name = "universal-iso-builder"
version = "2.0.0"
description = "Cross-platform desktop ISO builder"
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6==6.11.1",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.0",
    "pyinstaller==6.21.0",
    "pytest==9.0.3",
    "ruff==0.16.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [
    "build",
    "dist",
    "dist-onefile",
    "dist-qt",
    "dist-qt-onefile",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
